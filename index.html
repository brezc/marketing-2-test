const QUESTIONS=[{"n":1,"question":"Spotřebitelská znalost cen je obvykle:","opts":[{"text":"závislá na vzdělání","correct":false},{"text":"velmi špatná","correct":true},{"text":"závislá na zemi","correct":false},{"text":"velmi dobrá","correct":false},{"text":"závislá na věku","correct":false}],"notes":["(jinak nemusí být také správně nic)"],"page":2,"gradable":true,"format":"choice","uncertain":false},{"n":2,"question":"Korelace mezi cenou a kvalitou výrobků je dle výzkumů:","opts":[{"text":"výzkumy na toto téma neexistují","correct":false},{"text":"obecně slabě negativní","correct":false},{"text":"Obecně silně pozitivní","correct":false},{"text":"Výrazně silnější například u kosmetiky","correct":true},{"text":"obecně silně negativní","correct":false}],"notes":[],"page":2,"gradable":false,"format":"choice","uncertain":true},{"n":3,"question":"Působení nové ceny v následujících obdobích je označováno jako:","opts":[{"text":"Carryover efekt","correct":true},{"text":"Guttenbergův efekt","correct":false},{"text":"Veblenův efekt","correct":false},{"text":"Vilémův efekt","correct":false},{"text":"Degenův efekt","correct":false}],"notes":[],"page":2,"gradable":true,"format":"choice","uncertain":false},{"n":4,"question":"Která z uvedených složek je nejsilnější zisková páka, čili zlepšení které složky se v průměru odrazí největší mírou do zvýšení provozního zisku firmy?","opts":[{"text":"cena","correct":true},{"text":"variabilní náklady (možná)","correct":false},{"text":"fixní náklady","correct":false},{"text":"nelze zobecnit","correct":false},{"text":"objem","correct":false}],"notes":[],"page":2,"gradable":true,"format":"choice","uncertain":true},{"n":5,"question":"Pokud jde o tzv. nehledané zboží, co platí?","opts":[{"text":"jedná se např. zboží nakupované v urgentních případech","correct":false},{"text":"nazývá se rovněž impulzivní zboží","correct":false},{"text":"zákazníci o něm nevědí nebo o jeho pořízení obvykle neuvažují","correct":true},{"text":"vyžaduje reklamu a podporu prodeje","correct":true},{"text":"zákazníci jsou ochotni vyvolávat značné nákupní úsilí při jeho pořízení","correct":false}],"notes":[],"page":2,"gradable":true,"format":"choice","uncertain":false},{"n":6,"question":"Co patří mezi 4 základní fáze segmentace trhu?","opts":[{"text":"odlišení značky od hlavních konkurentů","correct":false},{"text":"postižení významných kritérií","correct":true},{"text":"dedukce segmentů od konkurence","correct":false},{"text":"rozvoj profilu segmentů","correct":true},{"text":"stanovení rozpočtu marketingových aktivit","correct":false},{"text":"další správné: vymezení daného trhu, využití významných kritérií/odkrytí segmentu","correct":true}],"notes":[],"page":3,"gradable":true,"format":"choice","uncertain":false},{"n":7,"question":"Když značka Campbell propaguje polévky také jako svačinu, jakou strategii zvýšení užívání zvolila?","opts":[{"text":"Vstup na nové tržní segmenty","correct":false},{"text":"Použití zlepšené kvality k přilákání nových zákazníků","correct":false},{"text":"Použití výrobků staršími, více tradičními způsoby","correct":false},{"text":"Užiju při více příležitostech","correct":true},{"text":"Používání produktu zcela novými způsoby (nové užití)","correct":true}],"notes":["uživatelů: vstup na nové tržní segmenty, zlepšení kvality, konverze neuživatelů, a získání","zákazníků konkurence), ale ptají se na zvyšování užití tak bych nechala poslední dvě jako","správné. CO SI MYSLÍTE?"],"page":3,"gradable":true,"format":"choice","uncertain":false},{"n":8,"question":"Supermarkety se vyznačují","opts":[{"text":"převahou prodeje pomocí obslužných úseků","correct":false},{"text":"plným sortimentem potravin","correct":true},{"text":"převahou nepotravinářského zboží - hyéermarkeí","correct":false},{"text":"u nepotravinářského zboží prodejem pouze základních druhů","correct":true},{"text":"prodejní plochou nad 5000m2","correct":false}],"notes":[],"page":3,"gradable":true,"format":"choice","uncertain":false},{"n":9,"question":"Která instituce zajišťuje samoregulaci reklamy na českém trhu?","opts":[{"text":"Rada pro reklamu","correct":true},{"text":"Rada pro rozhlasové a televizní vysílání","correct":false},{"text":"Úřad průmyslového vlastnictví","correct":false},{"text":"Ministerstvo průmyslu a obchodu","correct":false}],"notes":["Správná instituce je v původním PDF uvedena jako samostatná poznámka."],"page":3,"gradable":true,"format":"choice","noteType":"Chybějící správná varianta","uncertain":false},{"n":10,"question":"Které pojmy patří do modelu 5 M při plánování reklamní kampaně?","opts":[{"text":"Mission","correct":true},{"text":"Money","correct":true},{"text":"Media","correct":true},{"text":"Message","correct":true},{"text":"Measurement","correct":true},{"text":"Meeting","correct":false},{"text":"Management","correct":false},{"text":"Magic","correct":false}],"notes":[],"page":3,"gradable":true,"format":"choice","uncertain":false},{"n":11,"question":"Tracking studies patří do:","opts":[{"text":"distribučních testů","correct":false},{"text":"fyziologického testování účinků reklamy","correct":false},{"text":"metod testování obalu","correct":false},{"text":"testů marketingové mediální komunikace založené na měření prodejů","correct":false},{"text":"testů marketingové mediální komunikace založené na měření postojů","correct":true}],"notes":[],"page":3,"gradable":true,"format":"choice","uncertain":false},{"n":12,"question":"Pokud jde o co-branding, platí:","opts":[{"text":"jednou z jeho variant je branding složek výrobku","correct":true},{"text":"je důležitá podobnost zapojených značek","correct":false},{"text":"jde vždy o spolupráci dvou různých společností","correct":false},{"text":"je důležitý logický vztah mezi zapojenými značkami","correct":true},{"text":"je výhodou, pokud jedna ze značek uzavřela více partnerství","correct":false}],"notes":[],"page":4,"gradable":true,"format":"choice","uncertain":false},{"n":13,"question":"Mezi prvky značky patŕí např.:","opts":[{"text":"logo","co  const q=deck[at],st=state(q),testable=q.gradable&&q.format==='choice';const len=deck.length;
 $('progress').style.width=`${100*(at+1)/len}%`;$('current').textContent=`${at+1} / ${len}`;$('pdfRef').textContent=`PDF č. ${q.n} · str. ${q.page}`;$('qNumber').textContent=q.format==='flashcard'?'KARTIČKA':testable?'OTÁZKA':'NEJASNÉ';$('qTitle').textContent=q.question;
 $('typePill').textContent=q.format==='flashcard'?'Kartička':testable?`${q.opts.length} možností`:'Nebodované';
 $('typePill').classList.toggle('warn',!testable);$('warnPill').classList.toggle('hidden',!q.uncertain);
 $('hintText').textContent=q.format==='flashcard'?'Nejdřív si odpověz sama.':q.gradable?'Může být správně 1 i více možností.':'Bez bodování.';
 $('answerContainer').replaceChildren();$('feedback').replaceChildren();$('feedback').classList.add('hidden');
 const btn=$('checkBtn');btn.textContent=q.format==='flashcard'?'Ukázat odpověď':testable?'Zkontrolovat':'Ukázat podklad';btn.disabled=st.checked||((q.format==='choice')&&st.chosen.length===0);btn.classList.remove('hidden');
 $('nextBtn').textContent=at===deck.length-1?'Zobrazit výsledky':'Další otázka →';$('prevBtn').disabled=at===0;
 $('bookmark').classList.toggle('active',persist.bookmarks.includes(q.n));$('bookmark').textContent=persist.bookmarks.includes(q.n)?'★ Uloženo':'☆ Uložit';
 if(q.format==='choice'){
  const options=E('div',{class:'answers'});
  q.opts.forEach((o,i)=>{
   const button=E('button',{class:'opt'+(st.chosen.includes(i)?' selected':'')+((st.checked&&o.correct)?' reveal-correct':'')+((st.checked&&st.chosen.includes(i)&&!o.correct)?' reveal-wrong':''),type:'button',disabled:st.checked});
   button.append(E('span',{class:'letter',text:i<26?String.fromCharCode(65+i):String(i+1)}),E('span',{class:'otext',text:o.text}));
   button.addEventListener('click',()=>{if(st.checked)return;st.chosen=st.chosen.includes(i)?st.chosen.filter(n=>n!==i):[...st.chosen,i];render();});
   options.append(button);
  }); $('answerContainer').append(options);
 }else{const display=E('div',{class:'note'});display.textContent='Tato otázka v PDF nemá kompletní výběr možností. Zkus ji zodpovědět sama a pak odkryj odpověď z materiálu.';$('answerContainer').append(display);}
 if(st.checked){showFeedback(q,st,testable);btn.classList.add('hidden');}
 syncTimer(q,st);
}
function check(){const q=deck[at],st=state(q);if(st.checked)return;if(timerEnabled&&st.deadline&&Date.now()>=st.deadline){timeExpired(q,st);return;}stopTimer();st.checked=true;st.skipped=false;
 if(q.gradable){const correct=score(q,st.chosen);const h=persist.history[q.n]||{attempts:0};persist.history[q.n]={attempts:(h.attempts||0)+1,lastCorrect:correct,seenAt:Date.now()};SAVE();}
 render();}
function showFeedback(q,st,testable){const f=$('feedback');f.classList.remove('hidden');let header='',klass='neutral',line='';
 if(testable){const ok=!st.timedOut&&score(q,st.chosen);header=st.timedOut?'Čas vypršel · 0 bodů':ok?'Správně':'Špatně';klass=ok?'good':'bad';const correct=q.opts.flatMap((o,i)=>o.correct?[String.fromCharCode(65+i)]:[]);line='Správně: '+correct.join(' + ')+'.';}
 else if(q.format==='flashcard'){header=st.timedOut?'Čas vypršel · odpověď':'Odpověď';line=q.flashAnswer||'Podklad neobsahuje jednoznačně zaznamenanou odpověď.';}
 else {header='Bez bodování';line=q.sourceAnswer||'Ve zdrojovém PDF není jednoznačně zeleně označená odpověď. Pro kontrolu otevři uvedenou stránku PDF.';}
 f.append(E('div',{class:'feedback-title '+klass,text:header}),E('div',{class:'feedback-line',text:line}));
 if(q.sourceAnswer&&testable)f.append(E('div',{class:'feedback-line',text:q.sourceAnswer}));
 if(q.uncertain){f.append(E('div',{class:'source-notes',text:'⚠ U této položky jsou v podkladu pochybnosti, komentáře nebo neúplné označení. Zelené zvýraznění je převzaté z PDF, ne nezávisle ověřený výklad.'}));}
 if(q.notes?.length){let box=E('div',{class:'source-notes'});box.append(E('strong',{text:'Další text / poznámky uvedené v PDF'}));const ul=E('ul');q.notes.forEach(t=>ul.append(E('li',{text:t})));box.append(ul);f.append(box);}
 if(!testable&&q.format==='choice'&&q.opts?.length){let box=E('div',{class:'source-notes'});box.append(E('strong',{text:'Původní možnosti v PDF'}));const ul=E('ul');q.opts.forEach((o,i)=>ul.append(E('li',{text:String.fromCharCode(65+i)+'. '+o.text})));box.append(ul);f.append(box);}
}
function next(){stopTimer();if(timerEnabled&&deck[at]&&!state(deck[at]).checked){const q=deck[at],st=state(q);st.checked=true;st.timedOut=true;st.chosen=[];if(q.gradable){const h=persist.history[q.n]||{attempts:0};persist.history[q.n]={attempts:(h.attempts||0)+1,lastCorrect:false,seenAt:Date.now()};SAVE();}}if(at<deck.length-1){at++;render();window.scrollTo({top:0,behavior:'smooth'});}else finish();}
function prev(){stopTimer();if(at>0){at--;render();window.scrollTo({top:0,behavior:'smooth'});}}
function skip(){const q=deck[at],st=state(q);if(!st.checked)st.skipped=true;next();}
function bookmark(){const n=deck[at].n;const idx=persist.bookmarks.indexOf(n);if(idx>=0)persist.bookmarks.splice(idx,1);else persist.bookmarks.push(n);SAVE();render();}
function finish(){stopTimer();timerQuestion=null;document.body.classList.remove('quiz-active');const applicable=deck.filter(q=>q.gradable);const checked=applicable.filter(q=>session[q.n]?.checked);const right=checked.filter(q=>!session[q.n].timedOut&&score(q,session[q.n].chosen));const incorrect=checked.filter(q=>session[q.n].timedOut||!score(q,session[q.n].chosen));const unanswered=applicable.length-checked.length;
 $('home').classList.add('hidden');$('study').classList.add('hidden');$('results').classList.remove('hidden');$('scoreCircle').textContent=checked.length?Math.round(right.length*100/checked.length)+'%':'—';$('resultTitle').textContent='Hotovo';
 $('resultDesc').textContent=`${right.length} správně · ${incorrect.length} špatně · ${unanswered} bez odpovědi · ${deck.length-applicable.length} nebodovaných.`;
 const wl=$('wrongList');wl.replaceChildren();if(incorrect.length){wl.append(E('h3',{text:'Opakovat'}));incorrect.forEach(q=>{const b=E('button',{class:'wrong-item'});b.append(E('span',{text:`#${q.n} · ${q.question.slice(0,130)}`}),E('span',{text:'→'}));b.onclick=()=>{at=deck.findIndex(x=>x.n===q.n);$('results').classList.add('hidden');document.body.classList.add('quiz-active');$('study').classList.remove('hidden');render();};wl.append(b);});}else{wl.append(E('p',{class:'sub',text:'Bez chyb.'}));}
 drawStats();window.scrollTo({top:0,behavior:'smooth'});}
function restartWrong(){mode='wrong';setMode('wrong');limit='all';start();}
for(const b of document.querySelectorAll('[data-mode]'))b.addEventListener('click',()=>setMode(b.dataset.mode));
for(const b of document.querySelectorAll('[data-limit]'))b.addEventListener('click',()=>setLimit(b.dataset.limit));
$('shuffle').addEventListener('change',e=>random=e.target.checked);
$('timerEnabled').addEventListener('change',e=>$('timerLength').disabled=!e.target.checked);
$('start').addEventListener('click',start);
$('backHome').addEventListener('click',goHome);
$('checkBtn').addEventListener('click',check);
$('nextBtn').addEventListener('click',next);
$('prevBtn').addEventListener('click',prev);
$('skipBtn').addEventListener('click',skip);
$('bookmark').addEventListener('click',bookmark);
$('resultsBack').addEventListener('click',goHome);
$('resultsWrong').addEventListener('click',restartWrong);
$('resultsAgain').addEventListener('click',start);
$('resetProgress').addEventListener('click',()=>{if(confirm('Smazat uložené výsledky?')){persist.history={};persist.bookmarks=[];SAVE();drawStats();}});
window.addEventListener('keydown',e=>{if($('study').classList.contains('hidden'))return;if(e.metaKey||e.ctrlKey||e.altKey||['INPUT','TEXTAREA'].includes(document.activeElement?.tagName))return;const q=deck[at],st=state(q);const key=e.key.toLowerCase();if(/^[a-z]$/.test(key)&&q.format==='choice'&&!st.checked){const i=key.charCodeAt(0)-97;if(i<q.opts.length){st.chosen=st.chosen.includes(i)?st.chosen.filter(n=>n!==i):[...st.chosen,i];render();}}if(key==='enter'){if(!st.checked&&!(q.format==='choice'&&!st.chosen.length))check();else next();}if(key==='arrowright'&&st.checked)next();if(key==='arrowleft')prev();});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&timerEnabled&&deck[at]&&!$('study').classList.contains('hidden'))syncTimer(deck[at],state(deck[at]));});
drawStats();setMode('test');setLimit('all');
</script></body></html>
